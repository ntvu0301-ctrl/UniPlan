<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniPlan – Plan. Learn. Achieve.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#1e3a8a;
  --blue:#e0edff;
  --blue-soft:#eff6ff;
  --lav:#e8f1ff;
  --bg:#f4f8fd;
  --card:#ffffff;
  --ink:#0f172a;
  --mute:#475569;
  --line:rgba(148,163,184,0.18);
  --acc:#2563eb;
  --acc-hover:#1d4ed8;
  --ok:#059669;
  --red:#dc2626;
  --orange:#d97706;
  --shadow:0 10px 30px -10px rgba(37,99,235,0.08), 0 2px 8px -2px rgba(15,23,42,0.04);
  --shadow-lift:0 18px 38px -12px rgba(37,99,235,0.16), 0 4px 12px -2px rgba(15,23,42,0.05);
  --nav-bg:rgba(255,255,255,0.88);
  --ease:cubic-bezier(0.22, 1, 0.36, 1);
  box-sizing:border-box;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(5.5rem + env(safe-area-inset-top,0px))}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  font:15.5px/1.6 Lexend,system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 12% 0%, var(--blue-soft) 0%, var(--bg) 52%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* ---------- Buttons & Inputs ---------- */
.btn{
  background:var(--acc);
  color:#fff;
  border:0;
  border-radius:99px;
  padding:.6rem 1.25rem;
  cursor:pointer;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.4rem;
  text-decoration:none;
  white-space:nowrap;
  word-break:normal;
  transition:background-color .22s var(--ease), color .22s var(--ease), transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease);
}
.btn:hover{background:var(--acc-hover);transform:translateY(-1px);box-shadow:0 6px 18px -6px rgba(37,99,235,0.45)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--blue-soft);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--blue);box-shadow:0 4px 12px -4px rgba(37,99,235,0.18)}
.btn.out{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.out:hover{border-color:var(--acc);background:var(--blue-soft)}
.btn.pill{border-radius:99px;padding:.65rem 1.35rem}

input,select,textarea{
  width:100%;
  padding:.7rem .95rem;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--bg);
  margin:.3rem 0 .9rem;
  transition:border-color .22s var(--ease), background-color .22s var(--ease), box-shadow .22s var(--ease);
}
input:focus,select:focus,textarea:focus{
  background:var(--card);
  border-color:var(--acc);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent);
  outline:none;
}
label{font-size:.88rem;font-weight:500;color:var(--mute)}

/* ---------- Cards & Soft Hover Lift ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:1.45rem;
  margin-bottom:1.25rem;
  box-shadow:var(--shadow);
  transition:transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s var(--ease);
}
.lift-card:hover, a.stat:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lift);
  border-color:color-mix(in srgb,var(--acc) 30%,transparent);
}

.grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(min(100%, 280px),1fr))}
h1{font-size:1.85rem;font-weight:700;letter-spacing:-0.02em;margin:0 0 .35rem}
h2{font-size:1.12rem;font-weight:600;letter-spacing:-0.01em;margin:0 0 .65rem}
p{margin:.25rem 0}
.mute{color:var(--mute);font-size:.9rem}
.tag{
  display:inline-flex;
  align-items:center;
  background:var(--blue-soft);
  color:var(--acc);
  border:1px solid color-mix(in srgb,var(--acc) 18%,transparent);
  border-radius:99px;
  padding:.2rem .8rem;
  font-size:.78rem;
  font-weight:500;
  white-space:nowrap;
  word-break:normal;
  max-width:100%;
}
.tag.red{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent)}
.tag.orange{background:color-mix(in srgb,var(--orange) 12%,transparent);color:var(--orange);border-color:color-mix(in srgb,var(--orange) 25%,transparent)}

/* ---------- Auth Screen ---------- */
#auth{max-width:440px;margin:8vh auto;padding:2rem;border-radius:28px}
.tabs{display:flex;gap:.5rem;margin:1.1rem 0;background:var(--bg);padding:.3rem;border-radius:99px}
.tabs button{flex:1;box-shadow:none}

/* ---------- Floating Rounded Auto-Hide Navigation Bar ---------- */
.float-nav-wrap{
  position:fixed;
  top:calc(.75rem + env(safe-area-inset-top,0px));
  left:50%;
  transform:translate(-50%, 0);
  width:min(1240px, calc(100% - 1.5rem));
  z-index:50;
  transition:transform .38s var(--ease), opacity .32s var(--ease);
  will-change:transform, opacity;
}
.float-nav-wrap.nav-hidden{
  transform:translate(-50%, -155%);
  opacity:0;
  pointer-events:none;
}
.float-nav-wrap:focus-within{
  transform:translate(-50%, 0) !important;
  opacity:1 !important;
  pointer-events:auto !important;
}
.float-nav{
  display:flex;
  align-items:center;
  gap:.4rem;
  background:var(--nav-bg);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  border-radius:99px;
  padding:.45rem .65rem;
  box-shadow:0 12px 34px -8px rgba(37,99,235,0.14), 0 2px 6px rgba(15,23,42,0.04);
}
.nav-brand{
  display:flex;
  align-items:center;
  gap:.45rem;
  font-weight:700;
  font-size:1.05rem;
  color:var(--acc);
  text-decoration:none;
  padding:.4rem .85rem;
  border-radius:99px;
  white-space:nowrap;
}
.nav-links{
  display:flex;
  align-items:center;
  gap:.25rem;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  flex:1;
  min-width:0;
}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  color:var(--mute);
  text-decoration:none;
  padding:.48rem .78rem;
  border-radius:99px;
  font-size:.88rem;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  gap:.42rem;
  white-space:nowrap;
  flex:0 0 auto;
  transition:background-color .22s var(--ease), color .22s var(--ease), transform .22s var(--ease);
}
.nav-links a:hover{color:var(--ink);background:var(--blue-soft)}
.nav-links a.on{
  background:var(--acc);
  color:#fff;
  box-shadow:0 4px 12px -3px rgba(37,99,235,0.4);
}
.nav-links .badge{
  background:var(--red);
  color:#fff;
  border-radius:99px;
  font-size:.7rem;
  padding:.02rem .45rem;
  font-weight:600;
}
.nav-actions{
  display:flex;
  align-items:center;
  gap:.45rem;
  flex:none;
}
.avatar{
  width:2.2rem;
  height:2.2rem;
  border-radius:50%;
  background:var(--blue);
  color:var(--acc);
  border:1px solid color-mix(in srgb,var(--acc) 25%,transparent);
  display:inline-grid;
  place-items:center;
  text-decoration:none;
  font-weight:600;
  font-size:.9rem;
  flex:none;
  transition:transform .22s var(--ease), background-color .22s var(--ease);
}
.avatar:hover{transform:scale(1.05);background:var(--acc);color:#fff}
.lo-btn{
  background:transparent;
  border:1px solid var(--line);
  color:var(--mute);
  border-radius:99px;
  padding:.42rem .8rem;
  font-size:.82rem;
  cursor:pointer;
  white-space:nowrap;
  transition:background-color .22s var(--ease), color .22s var(--ease), border-color .22s var(--ease);
}
.lo-btn:hover{background:color-mix(in srgb,var(--red) 10%,transparent);color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent)}

/* ---------- Main Container & Generous Whitespace ---------- */
#app{
  max-width:1120px;
  margin:0 auto;
  padding:calc(6.2rem + env(safe-area-inset-top,0px)) 1.5rem 4rem;
}
.top{display:flex;justify-content:space-between;gap:.75rem;align-items:center;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1.25rem;flex-wrap:wrap;margin-bottom:1.5rem}
.head h1{font-size:2.1rem;margin:0}
.help{
  background:var(--blue-soft);
  border:1px solid color-mix(in srgb,var(--acc) 16%,transparent);
  border-radius:20px;
  padding:.95rem 1.25rem;
  margin-bottom:1.4rem;
  color:var(--ink);
  font-size:.93rem;
  overflow-wrap:break-word;
  word-break:normal;
}
.row{display:flex;justify-content:space-between;gap:.75rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}

/* ---------- Gentle Dropdown / Expandable Animation ---------- */
.expand-box{
  overflow:hidden;
  animation:gentleDrop .3s var(--ease) both;
  transform-origin:top;
}
@keyframes gentleDrop{
  from{opacity:0;transform:translateY(-8px) scaleY(0.97)}
  to{opacity:1;transform:translateY(0) scaleY(1)}
}

/* ---------- Page Fade + Slide Up & Scroll Reveal ---------- */
.page-enter{
  animation:pageFadeUp .42s var(--ease) both;
}
@keyframes pageFadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
.reveal{
  opacity:0;
  transform:translateY(16px);
  transition:opacity .52s var(--ease), transform .52s var(--ease);
}
.reveal.in{
  opacity:1;
  transform:translateY(0);
}

/* ---------- Dashboard Grid & Stat Cards ---------- */
.board{display:grid;gap:1.25rem;grid-template-columns:repeat(4,1fr);margin-bottom:1.25rem}
.board>*{margin:0;min-width:0}
.s2{grid-column:span 2}
.s4{grid-column:1/-1}
.statgrid{display:grid;gap:1.25rem;grid-template-columns:repeat(4,1fr)}
.statgrid>.sg-side{grid-row:1/span 2;display:flex;flex-direction:column;justify-content:center}
.statgrid>.sg-prog{grid-column:3}
.statgrid>.sg-timer{grid-column:4}
.statgrid.four{grid-template-columns:repeat(4,1fr)}
.statgrid>*{margin:0;min-width:0}
.statgrid>.stat{justify-content:center}
.lec-grid{grid-template-columns:repeat(3,1fr)}
.lec-grid>.expand-box{grid-column:1/-1}
.stat{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:.25rem;
  text-decoration:none;
  color:var(--ink);
}
.stat b{display:block;font-size:2rem;font-weight:700;color:var(--acc);line-height:1.15;margin:.15rem 0}
.stat.hl{
  background:linear-gradient(135deg,#2563eb 0%,#38bdf8 100%);
  color:#fff;
  border:0;
}
.stat.hl b{color:#fff}
.cap{font-size:.82rem;opacity:.88}

/* Notifications board */
.nb-block{border-left:4px solid var(--acc);padding:.15rem 0 .15rem .9rem;margin-top:.9rem}
.nb-block.red{border-left-color:var(--red)}
.nb-label{display:block;font-weight:700;color:var(--ink);margin-bottom:.2rem}
.nb-card .li b{font-weight:700}
.nb-overlay{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:1rem;overflow:auto}
.nb-modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lift);padding:1.4rem;width:min(30rem,100%);max-height:90vh;overflow:auto}
.nb-item{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--line);font-weight:400}
.nb-item:last-child{border-bottom:0}

.big{font-size:1.25rem;font-weight:600;line-height:1.35;margin:.45rem 0}
.li{display:flex;gap:.8rem;align-items:center;padding:.55rem 0}
.dot{width:2.1rem;height:2.1rem;border-radius:12px;background:var(--blue-soft);flex:none}
.dot.red{background:color-mix(in srgb,var(--red) 22%,var(--blue-soft))}
.dot.orange{background:color-mix(in srgb,var(--orange) 22%,var(--blue-soft))}
.dot.blue{background:var(--blue)}
.lg{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;margin-right:.35rem}

/* Animated Linear & Radial Progress */
.prog-track{
  width:100%;
  height:10px;
  background:var(--blue-soft);
  border-radius:99px;
  overflow:hidden;
  margin:.75rem 0 .4rem;
}
.prog-fill{
  height:100%;
  background:linear-gradient(90deg,#38bdf8,#2563eb);
  border-radius:99px;
  width:0%;
  transition:width .85s var(--ease);
}

/* Cozy Sky-Blue Study Timer */
.timer{
  background:linear-gradient(145deg,#1d4ed8 0%,#3b82f6 65%,#60a5fa 100%);
  color:#fff;
  border:0;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.timer h2{color:#fff;margin-bottom:.2rem}
.timer b{
  display:block;
  font-size:clamp(1.85rem, 5vw, 2.35rem);
  font-weight:700;
  letter-spacing:.04em;
  margin:.65rem 0 .9rem;
  white-space:nowrap;
  word-break:keep-all;
  font-variant-numeric:tabular-nums;
}
.timer-controls{
  display:flex;
  gap:.65rem;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  width:100%;
}
.rb{
  padding:.58rem 1.3rem;
  border-radius:99px;
  font-weight:600;
  border:0;
  cursor:pointer;
  background:#fff;
  color:#1d4ed8;
  font-size:.95rem;
  white-space:nowrap;
  word-break:keep-all;
  min-width:5.2rem;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
.rb:hover{transform:scale(1.05);box-shadow:0 6px 16px rgba(0,0,0,0.18)}

/* Alerts & Task Cards */
.tk{border-left:5px solid var(--blue);padding-left:1.35rem}
.tk.red,.alert.red{border-left-color:var(--red)}
.tk.orange,.alert.orange{border-left-color:var(--orange)}
.tk.blue,.alert.blue{border-left-color:var(--acc)}
.alert{
  padding:.7rem 1rem;
  border-radius:16px;
  margin-bottom:.6rem;
  border-left:5px solid var(--acc);
  background:var(--blue-soft);
}

/* Assignment Details Highlight Box */
.task-details-box{
  background:var(--blue-soft);
  border:1px solid color-mix(in srgb,var(--acc) 20%,transparent);
  border-radius:16px;
  padding:.85rem 1rem;
  margin:.7rem 0;
  color:var(--ink);
  font-size:.92rem;
  line-height:1.55;
}
.task-details-label{
  display:block;
  font-size:.76rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--acc);
  margin-bottom:.25rem;
}
.task-hint{
  font-size:.84rem;
  color:var(--mute);
  margin-top:.55rem;
  padding-top:.5rem;
  border-top:1px dashed var(--line);
}

/* Course-Grouped Directory Pills in Groups */
.course-filter-bar{
  display:flex;
  gap:.45rem;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:.85rem;
}
.course-section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.5rem;
  margin:1.1rem 0 .6rem;
  padding-bottom:.4rem;
  border-bottom:1px solid var(--line);
}
.course-section-head h3{
  margin:0;
  font-size:1rem;
  font-weight:600;
  color:var(--navy);
}
.group-pill-grid{
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
}

/* Chat & Video */
.chat{height:270px;overflow-y:auto;background:var(--bg);border-radius:18px;padding:.85rem;margin-bottom:.8rem;border:1px solid var(--line)}
.msg{max-width:82%;padding:.55rem .85rem;border-radius:18px;margin:.35rem 0;background:var(--card);border:1px solid var(--line);overflow-wrap:break-word}
.msg.me{margin-left:auto;background:var(--blue);border-color:color-mix(in srgb,var(--acc) 22%,transparent)}
.video{
  aspect-ratio:16/9;
  border-radius:18px;
  background:linear-gradient(135deg,#1e3a8a,#3b82f6);
  display:grid;
  place-items:center;
  color:#fff;
  margin-bottom:.8rem;
  padding:1rem;
  text-align:center;
  font-weight:500;
}

/* Language Toggle Pill */
.lang{
  display:inline-flex;
  vertical-align:middle;
  border:1px solid var(--line);
  border-radius:99px;
  overflow:hidden;
  background:var(--bg);
  font-size:.78rem;
  flex:none;
}
.lang button{
  border:0;
  background:transparent;
  color:var(--mute);
  padding:.28rem .65rem;
  cursor:pointer;
  font-weight:500;
  white-space:nowrap;
  transition:background-color .2s var(--ease), color .2s var(--ease);
}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--acc);font-weight:600}

/* Week-by-Week Calendar */
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:.75rem;margin-top:1rem}
.wday{
  min-height:250px;
  border:1px solid var(--line);
  border-radius:20px;
  padding:.75rem;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  gap:.5rem;
  transition:border-color .22s var(--ease), background-color .22s var(--ease);
}
.wday.now{
  border:2px solid var(--acc);
  background:color-mix(in srgb,var(--blue) 42%,var(--card));
}
.wday-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:.45rem;border-bottom:1px solid var(--line);margin-bottom:.1rem}
.wday-num{font-size:1.05rem;font-weight:600}
.wday.now .wday-num{background:var(--acc);color:#fff;border-radius:99px;padding:.08rem .55rem;font-size:.88rem}
.ev-item{
  background:var(--card);
  border:1px solid var(--line);
  border-left:5px solid var(--acc);
  border-radius:16px;
  padding:.65rem .8rem;
  font-size:.84rem;
  line-height:1.38;
  box-shadow:0 3px 10px rgba(15,23,42,0.04);
}
.ev-item.due{background:#fee2e2;border-color:#fecaca;border-left-color:#fca5a5;color:#7f1d1d}
.ev-item.due span{color:#9b3b3b}
.ev-item b{display:block;font-weight:700;font-size:.88rem;color:var(--ink);margin-bottom:.2rem;font-variant-numeric:tabular-nums}
.ev-item.due b{color:#7f1d1d}
.ev-item .ev-course{color:var(--ink);font-weight:400;margin-bottom:.2rem}
.ev-item span{display:block;color:var(--mute);font-size:.76rem}

#toast{
  position:fixed;
  left:50%;
  bottom:2rem;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--card);
  padding:.7rem 1.3rem;
  border-radius:99px;
  box-shadow:0 12px 28px rgba(15,23,42,0.2);
  display:none;
  z-index:60;
  font-size:.9rem;
  max-width:calc(100% - 2rem);
  text-align:center;
}

/* Assignment progress legend */
.progress-legend{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:flex-start;
  gap:.55rem .9rem;
  width:100%;
  min-width:0;
  margin-top:.65rem;
}
.progress-legend-item{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  min-width:0;
  white-space:nowrap;
  line-height:1.35;
  font-size:.82rem;
}
.progress-legend-item .lg{
  flex:0 0 .75rem;
  margin:0;
}

.card,.stat,.alert,.ev-item,.li>div,.top>*{
  min-width:0;
  overflow-wrap:break-word;
  word-break:normal;
}
.top h2{flex:1 1 auto;min-width:0}

/* Responsive Adjustments */
@media(max-width:1300px){
  .float-nav{border-radius:24px;flex-wrap:wrap;padding:.5rem .75rem}
  .nav-links{order:3;width:100%;flex:none;padding-top:.35rem;border-top:1px solid var(--line)}
  .nav-actions{margin-left:auto}
  #app{padding-top:calc(8.4rem + env(safe-area-inset-top,0px))}
}
@media(max-width:960px){
  .board{grid-template-columns:repeat(2,1fr)}
  .s2{grid-column:1/-1}
  .statgrid.four{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .board{grid-template-columns:1fr}
  .statgrid,.statgrid.four{grid-template-columns:repeat(2,1fr);gap:.8rem}
  .statgrid>.sg-side{grid-column:auto;grid-row:auto}
  .statgrid>.card{padding:.95rem}
  .statgrid>.stat{font-size:.9rem;justify-content:flex-start}
  .statgrid>.stat b{font-size:1.7rem}
  .statgrid h2{font-size:1rem}

function toLocalInput(ms){
  if (ms == null || isNaN(ms)) return "";
  const d = new Date(ms);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/* ---------- Floating Navigation Auto-Hide & Reveal Controller ---------- */
let lastScrollY = 0;
let idleTimer = null;

function showFloatingNav(){
  const nav = document.getElementById("floating-nav");
  if (nav) nav.classList.remove("nav-hidden");
}
function hideFloatingNav(){
  const nav = document.getElementById("floating-nav");
  if (!nav || S.navOpen) return;
  if (window.scrollY > 80 && !nav.contains(document.activeElement)){
    nav.classList.add("nav-hidden");
  }
}
function resetNavIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(hideFloatingNav, 3500);
}

window.addEventListener("scroll", () => {
  const y = window.scrollY;
  if (y < 60 || y < lastScrollY){
    showFloatingNav();
  } else if (y > 90 && y > lastScrollY + 6){
    hideFloatingNav();
  }
  lastScrollY = y;
  resetNavIdle();
}, {passive:true});

window.addEventListener("mousemove", e => {
  if (e.clientY < 75) showFloatingNav();
  resetNavIdle();
}, {passive:true});

window.addEventListener("keydown", () => {
  showFloatingNav();
  resetNavIdle();
}, {passive:true});

window.addEventListener("touchstart", () => {
  showFloatingNav();
  resetNavIdle();
}, {passive:true});

/* ---------- Smooth Scroll Reveal & Progress Bar Animation Hook ---------- */
let revealObserver = null;
function initEffects(){
  if (revealObserver) revealObserver.disconnect();
  const targets = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window){
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting){
          entry.target.classList.add("in");
          revealObserver.unobserve(entry.target);
        }
      });
    }, {threshold:0.06, rootMargin:"0px 0px -20px 0px"});
    targets.forEach(el => revealObserver.observe(el));
  } else {
    targets.forEach(el => el.classList.add("in"));
  }

  requestAnimationFrame(() => {
    document.querySelectorAll("[data-prog-target]").forEach(bar => {
      const target = bar.getAttribute("data-prog-target");
      bar.style.width = target + "%";
    });
  });
}

/* ---------- Auth ---------- */
function authView(){
  const reg = S.tab === "register";
  const name = h("input", {autocomplete:"name"}), email = h("input", {type:"email", required:"", autocomplete:"email"}),
        pw = h("input", {type:"password", required:"", minlength:"5"}), role = h("select", {}, h("option", {value:"student"}, "Student"), h("option", {value:"lecturer"}, "Lecturer"));
  const err = h("p", {class:"mute", role:"alert", style:"color:var(--red);min-height:1.4em"});
  const submit = e => {
    e.preventDefault();
    if (!email.value.includes("@") || pw.value.length < 5){ err.textContent = tr("Enter a valid email and a password of at least 5 characters."); return; }
    S.user = null;
    const mail = email.value.trim().toLowerCase(), found = DB.users.find(u => u.email === mail);
    if (reg){
      if (found){ err.textContent = tr("This email is already registered. Use the Log in tab."); return; }
      const u = {email:mail, password:pw.value, name:name.value.trim() || mail.split("@")[0], role:role.value};
      DB.users.push(u); S.user = u.name; S.role = u.role; S.email = u.email;
    } else {
      if (!found || found.password !== pw.value){ err.textContent = tr("Wrong email or password."); return; }
      S.user = found.name; S.role = found.role; S.email = found.email;
    }
    S.editingName = false;
    location.hash = "dashboard"; render();
  };
  return h("div", {id:"auth", class:"card page-enter"},
    h("div", {class:"top"}, h("h1", {style:"color:var(--acc)"}, "🎓 UniPlan"), langBtn()),
    h("p", {class:"mute"}, "Plan. Learn. Achieve."),
    h("div", {class:"tabs"}, ["login","register"].map(t => h("button", {class:"btn" + (S.tab === t ? "" : " ghost"), type:"button", onclick:() => { S.tab = t; render(); }}, t === "login" ? "Log in" : "Register"))),
    h("form", {onsubmit:submit}, reg ? field("Full name", name) : null, field("University email", email), field("Password", pw), reg ? field("I am a", role) : null, err, h("button", {class:"btn", style:"width:100%;margin-top:.4rem", type:"submit"}, reg ? "Create account" : "Log in")));
}

function addCourseCard(){
  const cid = h("input", {placeholder:"e.g. CS310"}), nm = h("input", {placeholder:"e.g. Operating Systems"}), room = h("input", {placeholder:"e.g. B2-401"});
  const day = h("select", {}, [1,2,3,4,5].map(d => h("option", {value:String(d)}, DOW()[d]))), from = h("input", {type:"time", value:"07:30"}), to = h("input", {type:"time", value:"09:00"});
  const add = e => {
    e.preventDefault();
    const id = cid.value.trim().toUpperCase(), name = nm.value.trim();
    if (!id || !name) return toast("Please enter a course code and name.");
    if (DB.courses.some(c => c.id === id)) return toast("That course code already exists.");
    DB.courses.push({id, name, lecturer:S.user, room:room.value.trim() || "TBA", sched:[[Number(day.value), from.value, to.value]]});
    announce("course", "New course: " + name + " (" + id + ")");
    toast("Course added."); render();
  };
  return h("form", {class:"card reveal", onsubmit:add}, h("h2", {}, "Add a course"), field("Course code", cid), field("Course name", nm), field("Room", room), field("Day", day), field("Start", from), field("End", to),
    h("p", {style:"margin-top:.7rem"}, h("button", {class:"btn", type:"submit"}, "Add course")));
}

const courseSessions = c => {
  const dated = DB.sessions.filter(x => x.course === c.id).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start)).map(x => {
    const [y, m, d] = x.date.split("-").map(Number);
    return h("p", {style:"font-size:.9rem"}, DOW()[new Date(y, m - 1, d).getDay()] + " " + pad2(d) + "/" + pad2(m) + " · " + x.start + "–" + x.end);
  });
  const weekly = (c.sched || []).map(sl => h("p", {style:"font-size:.9rem"}, DOW()[sl[0]] + " · " + sl[1] + "–" + sl[2]));
  const all = dated.concat(weekly);
  return all.length ? all : [h("p", {class:"mute", style:"font-size:.9rem"}, "No classes scheduled yet.")];
};

function level(t){ if (t.done || !hasDue(t)) return null; const d = t.due - nowMs(); return d <= DAY ? "red" : d <= 3 * DAY ? "orange" : d <= 7 * DAY ? "blue" : null; }
function left(t){

  const d = t.due - nowMs(), a = Math.abs(d), vi = S.lang === "vi", days = Math.floor(a / DAY), hr = Math.floor(a % DAY / HOUR), mn = Math.floor(a % HOUR / 60000);
  const s = days >= 2 ? days + (vi ? " ngày" : " days") : a >= HOUR ? (days * 24 + hr) + "h " + mn + "m" : mn + (vi ? " phút" : " min");
  return d < 0 ? (vi ? "Quá hạn " : "Overdue by ") + s : vi ? "Còn " + s : s + " left";
}
function prio(t){
  if (t.done || !hasDue(t)) return "Low";

  const d = t.due - nowMs(), n = Math.ceil(d / DAY), hp = prio(t) === "High" ? " High priority." : "";

  return md.length ? md.map(({t, lv}) => h("div", {class:"li"}, h("span", {class:"dot " + lv}), h("div", {}, h("b", {}, t.title), h("small", {class:"mute", style:"display:block"}, t.course + " · " + left(t))))) : [h("p", {class:"mute"}, "No must-do tasks right now.")];
}
function boardPopup(){
  const fresh = unseen();
  if (S.role !== "student" || !fresh.length) return null;
  const close = go => { fresh.forEach(f => f.seen = true); if (go) location.hash = go; render(); };
  return h("div", {class:"nb-overlay", role:"dialog", "aria-modal":"true", "aria-label":"Notifications board"},
    h("div", {class:"nb-modal"},
      h("div", {class:"top"}, h("h2", {}, "🔔 Notifications board"), h("span", {class:"tag"}, fresh.length + " " + tr("new"))),
      h("div", {class:"nb-block"}, h("span", {class:"nb-label"}, "New update"),
        fresh.map(f => h("div", {class:"nb-item"}, h("span", {}, f.text)))),
      h("div", {class:"nb-block red"}, h("span", {class:"nb-label"}, "Must-do tasks"), mustDoList()),
      h("div", {style:"display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1rem"},
        h("button", {class:"btn", type:"button", onclick:() => close()}, "Got it"),
        h("button", {class:"btn ghost", type:"button", onclick:() => close("assignments")}, "Open assignments"))));
}
const DOW = () => S.lang === "vi" ? ["CN","T2","T3","T4","T5","T6","T7"] : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const hm = ms => new Date(ms).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
const classesOn = day => {
  const key = dkey(day);
  const dated = DB.sessions.filter(x => x.date === key).map(x => { const c = course(x.course) || {}; return {id:x.course, name:c.name || x.course, room:x.room, lecturer:c.lecturer || "", time:x.start + "–" + x.end}; });
  const weekly = DB.courses.flatMap(c => (c.sched || []).filter(sl => sl[0] === day.getDay()).map(sl => ({id:c.id, name:c.name, room:c.room, lecturer:c.lecturer || "", time:sl[1] + "–" + sl[2]})));
  return dated.concat(weekly).sort((a, b) => a.time.localeCompare(b.time));
};

function completionStats(){
  const done = DB.tasks.filter(t => t.done).length;
  const soon = DB.tasks.filter(t => level(t)).length;
  const total = DB.tasks.length || 1;
  return { done, soon, total, pct: Math.round((done / total) * 100) };
}

function submit(t){
  pick(f => {
    if (f.size > 25 * 1024 * 1024) return toast("File is too large (max 25 MB).");
    S.prevDonePct = completionStats().pct;
    t.done = true; t.submitted = {name:f.name, at:nowMs(), late:hasDue(t) && nowMs() > t.due};
    toast("Submitted: " + f.name); render();
  });
}

function taskCard(t, i, fromHome){
  const lv = level(t);
  const showDetails = S.openDetails.has(t.id);
  return h("div", {class:"card lift-card reveal tk " + (lv || "")},
    h("div", {class:"top"}, h("h2", {}, t.title), h("span", {class:"tag " + (lv || "")}, t.done ? "Completed" : left(t))),
    h("p", {class:"mute"}, t.course + " · " + (hasDue(t) ? new Date(t.due).toLocaleString(locale(), {dateStyle:"medium", timeStyle:"short"}) : tr("No deadline yet"))),
    h("div", {style:"display:flex;gap:.4rem;flex-wrap:wrap;margin:.45rem 0"},
      h("span", {class:"tag"}, tr("Priority") + ": " + tr(prio(t))),
      h("span", {class:"tag"}, t.done ? "Completed" : "Not completed")),
    showDetails ? h("div", {class:"task-details-box expand-box"},
      h("span", {class:"task-details-label"}, "Assignment details"),
      fromHome || !t.detail ? h("div", {}, t.notes || "No notes.") : h("div", {class:"rich"}, richView(t.detail))) : null,
    showDetails && t.links && (fromHome || !t.detail) ? h("div", {class:"task-links"}, t.links.map(l => h("a", {class:"btn ghost", href:l.href, target:"_blank", rel:"noopener noreferrer"}, l.label + " ↗"))) : null,
    t.done && t.submitted ? h("p", {class:"mute"}, tr("Submitted") + ": " + t.submitted.name + " · " + new Date(t.submitted.at).toLocaleString(locale(), {dateStyle:"medium", timeStyle:"short"}) + (t.submitted.late ? " (" + tr("late") + ")" : "")) : null,
    t.done ? null : h("p", {class:"task-hint"}, advice(t, i)),
    h("div", {style:"display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.85rem"},
      t.done ? null : h("button", {class:"btn", onclick:() => submit(t)}, "Submit assignment"),
      h("button", {class:"btn ghost", onclick:() => {
        if (showDetails) S.openDetails.delete(t.id);
        else S.openDetails.add(t.id);
        render();
      }}, showDetails ? "Hide details" : "Show details")));
}

/* Assignments Page */
pages.assignments = function(){
  if (S.role === "lecturer"){
    const titleInp = h("input", {placeholder:"e.g. Binary Trees Lab"}),
          courseSel = courseSelect(),
          dueInp = h("input", {type:"datetime-local", value:toLocalInput(hoursFromNow(48))}),
          prSel = h("select", {}, ["High","Medium","Low"].map(p => h("option", {value:p}, p))),
          notesInp = h("textarea", {rows:"3", placeholder:"Write assignment instructions, rubric, or submission requirements..."});
    prSel.value = "Medium";

    const createTask = e => {
      e.preventDefault();
      if (!titleInp.value.trim() || !dueInp.value) return toast("Please enter a title and deadline.");
      const cObj = course(courseSel.value);
      const dueMs = new Date(dueInp.value).getTime();
      const newTask = {
        id: Date.now(),
        title: titleInp.value.trim(),
        course: cObj ? cObj.name : courseSel.value,
        courseId: courseSel.value,
        due: dueMs,
        priority: prSel.value,
        done: false,
        notes: notesInp.value.trim() || "No additional instructions."
      };
      DB.tasks.unshift(newTask);
      announce("assignment", `New assignment: ${newTask.title} (${newTask.course}) – Due ${new Date(dueMs).toLocaleDateString(locale())}`);
      toast("Homework assigned and deadline set.");
      render();
    };

    const formCard = h("div", {class:"card reveal"},
      h("h2", {}, "Assign homework"),
      h("form", {onsubmit:createTask},
        field("Assignment title", titleInp),
        h("div", {class:"grid"},
          field("Course", courseSel),
          field("Deadline date & time", dueInp)),
        field("Instructions & notes", notesInp),
        h("button", {class:"btn", type:"submit"}, "Assign & set deadline")));

    const sortedTasks = [...DB.tasks].sort(byDue);

    const listCards = sortedTasks.map(t => {
      if (S.editTaskId === t.id){
        const eTitle = h("input", {value:t.title}),
              eCourse = courseSelect(t.courseId || (DB.courses.find(c => c.name === t.course) || {}).id),
              eDue = h("input", {type:"datetime-local", value:toLocalInput(t.due)}),
              ePr = h("select", {}, ["High","Medium","Low"].map(p => h("option", {value:p}, p))),
              eNotes = h("textarea", {rows:"3"});
        ePr.value = t.priority;
        eNotes.value = t.notes || "";

        return h("div", {class:"card expand-box"},
          h("h2", {}, "Edit assignment"),
          field("Assignment title", eTitle),
          h("div", {class:"grid"},
            field("Course", eCourse),
            field("Deadline date & time", eDue)),
          field("Instructions & notes", eNotes),
          h("div", {style:"display:flex;gap:.5rem;flex-wrap:wrap"},
            h("button", {class:"btn", type:"button", onclick:() => {
              if (!eTitle.value.trim() || !eDue.value) return toast("Please enter a title and deadline.");
              const cObj = course(eCourse.value);
              t.title = eTitle.value.trim();
              t.courseId = eCourse.value;
              t.course = cObj ? cObj.name : eCourse.value;
              t.due = new Date(eDue.value).getTime();
              t.priority = ePr.value;
              t.notes = eNotes.value.trim();
              S.editTaskId = null;
              toast("Assignment updated.");
              render();
            }}, "Save changes"),
            h("button", {class:"btn ghost", type:"button", onclick:() => { S.editTaskId = null; render(); }}, "Cancel")));
      }

      const lv = level(t);
      return h("div", {class:"card lift-card reveal tk " + (lv || "")},
        h("div", {class:"top"},
          h("h2", {}, t.title),
          h("span", {class:"tag " + (lv || "")}, t.done ? "Completed" : left(t))),
        h("p", {class:"mute"}, t.course + " · " + (hasDue(t) ? tr("Due") + ": " + new Date(t.due).toLocaleString(locale(), {dateStyle:"medium", timeStyle:"short"}) : tr("No deadline yet"))),
        h("p", {style:"margin:.4rem 0"}, h("span", {class:"tag"}, tr("Priority") + ": " + tr(prio(t)))),
        h("div", {class:"task-details-box"},
          h("span", {class:"task-details-label"}, "Assignment details"),
          h("div", {}, t.notes || "")),
        h("div", {style:"margin-top:.9rem;display:flex;gap:.5rem;flex-wrap:wrap"},
          h("button", {class:"btn ghost", type:"button", onclick:() => { S.editTaskId = t.id; render(); }}, "Edit assignment"),
          h("button", {class:"btn out", type:"button", onclick:() => {
            const idx = DB.tasks.indexOf(t);
            if (idx > -1) DB.tasks.splice(idx, 1);
            toast("Assignment deleted.");
            render();
          }}, "Delete")));
    });

    return [
      help("Assign homework with deadlines for your students, or edit existing assignments below."),
      formCard,
      h("h2", {class:"reveal", style:"margin:1.25rem 0 .75rem"}, "Manage assigned homework"),
      h("div", {class:"grid"}, listCards)
    ];
  }

  /* Student view */
  const stats = completionStats();
  const progBar = h("div", {class:"prog-fill", "data-prog-target":String(stats.pct), style:`width:${S.prevDonePct}%`});
  S.prevDonePct = stats.pct;

  const progressBanner = h("div", {class:"card reveal"},
    h("div", {class:"top"},
      h("h2", {style:"margin:0"}, "Assignment progress"),
      h("span", {class:"tag"}, `${stats.done} / ${stats.total} (${stats.pct}%)`)),
    h("div", {class:"prog-track"}, progBar),
    h("p", {class:"mute", style:"font-size:.82rem"}, stats.done === stats.total ? "All caught up. No pending assignments." : `${stats.total - stats.done} remaining`));

  const f = S.find || (S.find = {text:"", course:"", pr:"", st:""});
  const text = h("input", {type:"search", placeholder:"Search by title or course", "aria-label":"Search assignments"});
  text.value = f.text;
  const choice = (key, opts) => { const s = h("select", {}, opts.map(o => h("option", {value:o[0]}, o[1]))); s.value = f[key]; s.addEventListener("change", () => { f[key] = s.value; draw(); }); return s; };
  const courseSel = choice("course", [["", "All courses"], ...DB.courses.map(c => [c.name, c.name])]),
        pr = choice("pr", [["", "All priorities"], ["High", "High"], ["Medium", "Medium"], ["Low", "Low"]]),
        st = choice("st", [["", "All statuses"], ["todo", "Not completed"], ["done", "Completed"]]);
  const box = h("div"), count = h("p", {class:"mute", role:"status", style:"margin-top:.5rem"});
  function draw(){
    const q = f.text.trim().toLowerCase(), rank = ranked();
    const hits = DB.tasks.filter(t => (!q || (t.title + " " + t.course).toLowerCase().includes(q)) && (!f.course || t.course === f.course) && (!f.pr || prio(t) === f.pr) && (!f.st || (f.st === "done") === t.done))
      .sort((a, b) => a.done - b.done || score(b) - score(a) || byDue(a, b));
    count.textContent = hits.length + " " + tr(hits.length === 1 ? "assignment found" : "assignments found");
    box.replaceChildren(...(hits.length ? hits.map(t => taskCard(t, rank.indexOf(t))) : [h("p", {class:"mute"}, "No assignments match your search. Try another word or clear the filters.")]));
    initEffects();
  }
  text.addEventListener("input", () => { f.text = text.value; draw(); });
  draw();
  return [
    help("Type a word to find an assignment, or use the filters. Alerts turn red, orange or blue as deadlines get closer. An assignment counts as completed only after you submit it."),
    progressBanner,
    h("div", {class:"card reveal"}, h("h2", {}, "Smart Deadline Alerts & Recommendations"), alertStrip().length ? alertStrip() : h("p", {class:"mute"}, "No deadline alerts right now.")),
    h("div", {class:"card reveal"}, h("h2", {}, "Find assignments"), field("Search", text), h("div", {class:"grid"}, field("Course", courseSel), field("Priority", pr), field("Status", st)),
      h("button", {class:"btn ghost", onclick:() => { S.find = null; render(); }}, "Clear filters"), count),
    h("div", {class:"card reveal"}, h("h2", {}, "Time simulation"), h("p", {class:"mute"}, "Move the clock forward to watch alerts change. Each alert level is announced only once per assignment."),
      h("div", {style:"margin:.6rem 0;display:flex;gap:.5rem;flex-wrap:wrap"},
        h("button", {class:"btn ghost", onclick:() => { S.skew += DAY; notify(); render(); }}, "Simulate +1 day"),
        h("button", {class:"btn ghost", onclick:() => { S.skew = 0; render(); }}, "Reset time")),
      h("p", {class:"mute"}, tr("Simulated time") + ": " + new Date(nowMs()).toLocaleString(locale(), {dateStyle:"medium", timeStyle:"short"}))),
    box
  ];
};

/* Group Work — Organized by Semester Courses */
pages.groups = function(){
  const st = S.role === "student";
  const activeFilter = S.groupCourseFilter || "ALL";
  const visibleGroups = activeFilter === "ALL" ? DB.groups : DB.groups.filter(x => x.course === activeFilter);
  const g = visibleGroups.find(x => x.id === S.group) || visibleGroups[0] || null;
  if (g) S.group = g.id;

  const lessonName = id => (DB.courses.find(c => c.id === id) || {}).name || id;
  const nm = h("input", {placeholder:"Group name", "aria-label":"Group name"});
  const lesson = h("select", {}, DB.courses.map(c => h("option", {value:c.id}, c.id + " – " + c.name)));
  if (activeFilter !== "ALL") lesson.value = activeFilter;
  const mail = h("input", {type:"email", placeholder:"Classmate’s email", "aria-label":"Classmate’s email"});

  const intro = help("Choose a group organized by your semester courses, chat below, or press Audio/Video call. Chat is a local demo; calls use your microphone and camera on this device only.");

  const courseFilterBar = h("div", {class:"course-filter-bar"},
    h("button", {
      class:"btn" + (activeFilter === "ALL" ? "" : " ghost"),
      style:"padding:.42rem .9rem;font-size:.82rem",
      onclick:() => { S.groupCourseFilter = "ALL"; render(); }
    }, `${tr("All courses")} (${DB.groups.length})`),
    DB.courses.map(c => {
      const cnt = DB.groups.filter(gr => gr.course === c.id).length;
      return h("button", {
        class:"btn" + (activeFilter === c.id ? "" : " ghost"),
        style:"padding:.42rem .9rem;font-size:.82rem",
        onclick:() => { S.groupCourseFilter = c.id; S.group = null; render(); }
      }, `${c.id} (${cnt})`);
    }),
    st ? h("button", {
      class:"btn" + (S.newGroup ? "" : " out"),
      style:"margin-left:auto;padding:.42rem .95rem;font-size:.82rem",
      "aria-pressed":String(!!S.newGroup),
      onclick:() => { S.newGroup = !S.newGroup; render(); }
    }, "+ New group") : null
  );

  const coursesToShow = activeFilter === "ALL"
    ? DB.courses.filter(c => DB.groups.some(gr => gr.course === c.id))
    : DB.courses.filter(c => c.id === activeFilter);

  const groupedDirectory = coursesToShow.length
    ? coursesToShow.map(c => {
        const cGroups = DB.groups.filter(gr => gr.course === c.id);
        return h("div", {},
          h("div", {class:"course-section-head"},
            h("h3", {}, `${c.id} – ${c.name}`),
            h("span", {class:"tag"}, `${cGroups.length}`)),
          cGroups.length
            ? h("div", {class:"group-pill-grid"}, cGroups.map(x =>
                h("button", {
                  class:"btn" + (x === g ? "" : " ghost"),
                  style:"padding:.48rem 1rem;font-size:.88rem",
                  onclick:() => { S.group = x.id; S.confirmDel = null; S.inviting = false; render(); }
                }, x.name)))
            : h("p", {class:"mute", style:"font-size:.86rem"}, "No groups in this course yet."));
      })
    : [h("p", {class:"mute"}, "No groups yet. Create one for each lesson you need.")];

  const directoryCard = h("div", {class:"card reveal"}, courseFilterBar, groupedDirectory);

  const create = () => {
    if (!nm.value.trim()) return toast("Add a group name first.");
    const ng = {id:Date.now(), name:nm.value.trim(), course:lesson.value, owner:"You", members:["You"], files:[], msgs:[]};
    DB.groups.push(ng);
    S.group = ng.id;
    S.newGroup = false;
    if (S.groupCourseFilter !== "ALL") S.groupCourseFilter = ng.course;
    toast("Group created.");
    render();
  };

  const form = S.newGroup && st ? h("div", {class:"card expand-box"}, h("h2", {}, "Create a group for a course"), field("Group name", nm), field("Course", lesson),
    h("div", {style:"display:flex;gap:.5rem"}, h("button", {class:"btn", onclick:create}, "Create group"), h("button", {class:"btn ghost", onclick:() => { S.newGroup = false; render(); }}, "Cancel"))) : null;

  if (!g) return [intro, directoryCard, form];

  const box = h("div", {class:"chat"}), inp = h("input", {style:"margin:0", placeholder:"Write a message", "aria-label":"Message"});
  const draw = () => { box.replaceChildren(...g.msgs.map(m => h("div", {class:"msg" + (m[0] === "You" ? " me" : "")}, h("small", {class:"mute"}, m[0]), h("div", {}, m[1])))); box.scrollTop = box.scrollHeight; };
  const send = e => { e.preventDefault(); const t = inp.value.trim(); if (!t) return; g.msgs.push(["You", t]); inp.value = ""; draw(); };
  const invite = e => { e.preventDefault(); const v = mail.value.trim(); if (!v.includes("@")) return toast("Enter a valid email."); g.members.push(v.split("@")[0] + " (invited)"); S.inviting = false; toast("Invite sent to " + v + " (demo)."); render(); };
  draw();

  const del = !st ? null : g.owner !== "You" ? h("p", {class:"mute"}, "Only the creator can delete this group.")
    : S.confirmDel === g.id ? h("div", {class:"help expand-box", style:"margin-top:.8rem"}, h("p", {}, "Delete this group? Its chat and file list will be removed for everyone."),
        h("div", {style:"display:flex;gap:.5rem;margin-top:.5rem"}, h("button", {class:"btn", onclick:() => { DB.groups.splice(DB.groups.indexOf(g), 1); S.group = null; S.confirmDel = null; toast("Group deleted."); render(); }}, "Yes, delete group"), h("button", {class:"btn ghost", onclick:() => { S.confirmDel = null; render(); }}, "Cancel")))
    : h("button", {class:"btn out", style:"margin-top:.6rem", onclick:() => { S.confirmDel = g.id; render(); }}, "Delete group");

  return [intro, directoryCard, form, h("div", {class:"card reveal"}, h("div", {class:"top"}, h("h2", {}, g.name), h("span", {class:"tag"}, g.course + " · " + lessonName(g.course))),
    h("p", {class:"mute", style:"margin-bottom:.6rem"}, tr("Members") + ": " + g.members.join(", ")), box, h("form", {onsubmit:send, style:"display:flex;gap:.5rem;align-items:center"}, inp, h("button", {class:"btn", type:"submit"}, "Send")),
    h("div", {style:"margin:.8rem 0;display:flex;gap:.5rem;flex-wrap:wrap"}, h("button", {class:"btn ghost", onclick:() => startCall(g, false)}, "Audio call"), h("button", {class:"btn ghost", onclick:() => startCall(g, true)}, "Video call"),
      st ? h("button", {class:"btn" + (S.inviting ? "" : " ghost"), "aria-pressed":String(!!S.inviting), onclick:() => { S.inviting = !S.inviting; render(); }}, "Invite") : null, h("button", {class:"btn ghost", onclick:() => pick(f => { g.files.push(f.name); toast("Shared: " + f.name); render(); })}, "Share file")),
    S.inviting ? h("form", {onsubmit:invite, class:"expand-box", style:"display:flex;gap:.5rem;margin-bottom:.7rem;align-items:center"}, Object.assign(mail, {style:"margin:0"}), h("button", {class:"btn", type:"submit"}, "Send invite")) : null,
    h("p", {class:"mute"}, tr("Files") + ": " + (g.files.join(", ") || tr("none yet"))), del)];
};

/* Dashboard */
const clock = () => { const t = S.timer, s = Math.floor((t.acc + (t.run ? Date.now() - t.since : 0)) / 1000); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(pad2).join(":"); };
setInterval(() => { const el = document.querySelector("[data-clock]"); if (el) el.textContent = clock(); }, 1000);
const arc = (from, len, paint) => len > 0 ? `<path d="M15 105 A85 85 0 0 1 185 105" pathLength="100" fill="none" style="stroke:${paint}" stroke-width="20" stroke-linecap="round" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${-from}"/>` : "";

  const dot = (c, txt) => h("span", {class:"progress-legend-item mute"}, h("i", {class:"lg", style:"background:" + c}), txt);

  const progBar = h("div", {class:"prog-fill", "data-prog-target":String(stats.pct), style:`width:${S.prevDonePct}%`});

  const statCards = cards.map((c, i) => h("a", {href:"#" + c[2], class:"card stat reveal" + (i === 0 ? " hl" : "")}, h("span", {}, c[1]), h("b", {}, String(c[0])), h("small", {class:"cap"}, c[3])));

/* ---------- Week-by-Week Calendar View ---------- */
pages.calendar = function(){
  const now = new Date(nowMs());
  const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() + (S.cal * 7));
  const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 6);

  const rangeTitle = startOfWeek.toLocaleDateString(locale(), {month:"short", day:"numeric"}) + " – " +
                     endOfWeek.toLocaleDateString(locale(), {month:"short", day:"numeric", year:"numeric"});

  const cols = [];
  for (let i = 0; i < 7; i++){
    const day = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + i);
    const key = dkey(day);
    const isToday = key === dkey(now);

    const items = classesOn(day).map(c => ({
      time: c.time,
      title: c.id + " · " + c.name,
      sub: (c.room || "").split(",")[0].trim(),
      due: false
    }))
    .concat(
      DB.tasks
        .filter(t => hasDue(t) && (!t.done || S.role === "lecturer") && dkey(new Date(t.due)) === key)
        .map(t => ({
          time: hm(t.due),
          title: tr("Due") + ": " + t.title,
          sub: t.course,
          due: true
        }))
    )
    .sort((a, b) => a.time.localeCompare(b.time));

    cols.push(h("div", {class:"wday" + (isToday ? " now" : "")},
      h("div", {class:"wday-head"},
        h("span", {class:"mute", style:"font-weight:500"}, DOW()[i]),
        h("span", {class:"wday-num"}, String(day.getDate()))),
      items.length
        ? items.map(x => h("div", {class:"ev-item" + (x.due ? " due" : "")},
            h("b", {}, x.time),
            h("div", {class:"ev-course"}, x.title),
            h("span", {}, x.sub)))
        : h("p", {class:"mute", style:"font-size:.78rem;margin-top:.5rem"}, "No events")));
  }

  return [
    help("This is your week-by-week calendar showing your classes and assignment deadlines. Use the arrows to switch weeks."),
    h("div", {class:"card reveal"},
      h("div", {class:"top"},
        h("div", {style:"display:flex;gap:.4rem;align-items:center"},
          iconBtn("Previous week", "M15 5l-7 7 7 7", () => { S.cal--; render(); }),
          h("button", {class:"btn ghost", onclick:() => { S.cal = 0; render(); }}, "Today"),
          iconBtn("Next week", "M9 5l7 7-7 7", () => { S.cal++; render(); })),
        h("h2", {style:"margin:0"}, rangeTitle)),

    class:x === p ? "on" : "",
    "aria-current":x === p ? "page" : "false"
  }, name, badge ? h("span", {class:"badge"}, String(badge)) : null);

  const navToggle = h("button", {class:"nav-toggle", type:"button", "aria-label":"Menu", "aria-expanded":String(!!S.navOpen), "aria-controls":"nav-menu", onclick:() => setNav(!S.navOpen)});
  navToggle.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  const floatingNav = h("header", {id:"floating-nav", class:"float-nav-wrap" + (S.navOpen ? " open" : "")},
    h("nav", {class:"float-nav", "aria-label":"Primary Navigation"},
      h("a", {href:"#dashboard", class:"nav-brand"}, "🎓 UniPlan"),
      navToggle,
      h("div", {class:"nav-links", id:"nav-menu", onclick:e => { if (e.target.closest("a")) setNav(false); }},
        NAV.filter(x => st || x[0] !== "groups").map(([x, ico, name]) => navLink(x, ico, name))
      ),
      h("div", {class:"nav-actions"},
        langBtn(),
        h("a", {href:"#profile", class:"avatar", "aria-label":"Profile", title:S.user}, S.user[0].toUpperCase()),
        h("button", {class:"lo-btn", type:"button", onclick:() => { S.user = null; S.editingName = false; S.tab = "login"; location.hash = ""; render(); }}, "Log out")
      )
    )
  );

  const title = (NAV.find(x => x[0] === p) || [0, 0, label(p)])[2];
  const head = p === "dashboard"
    ? h("div", {class:"head"},
        h("div", {},
          h("h1", {}, "Dashboard"),
          h("p", {class:"mute"}, greet() + " " + tr("Here’s what’s happening today."))),
        h("div", {style:"display:flex;gap:.6rem;flex-wrap:wrap"},
          h("a", {href:"#assignments", class:"btn pill out"}, st ? "Find assignments" : "Assign homework"),
          h("a", {href:"#calendar", class:"btn pill out"}, "View calendar")))
    : h("div", {class:"head"}, h("h1", {}, title));

  const mainStage = h("div", {id:"app"},
    h("main", {class:"page-enter"}, head, pages[p]())
  );

  root.replaceChildren(...[floatingNav, mainStage, boardPopup()].filter(Boolean));
  showFloatingNav();
  resetNavIdle();
  initEffects();
}

function setNav(open){
  S.navOpen = open;
  const w = document.getElementById("floating-nav");
  if (!w) return;
  w.classList.toggle("open", open);
  const b = w.querySelector(".nav-toggle");
  if (b) b.setAttribute("aria-expanded", String(open));
}
document.addEventListener("click", e => { if (S.navOpen && !e.target.closest("#floating-nav")) setNav(false); });
window.addEventListener("keydown", e => { if (e.key === "Escape" && S.navOpen){ setNav(false); const b = document.querySelector(".nav-toggle"); if (b) b.focus(); } });
window.addEventListener("resize", () => { if (S.navOpen && window.innerWidth > 760) setNav(false); });
window.addEventListener("hashchange", () => {
  S.navOpen = false;
  window.scrollTo({top:0, behavior:"smooth"});
  render();
});
setInterval(() => {
  const a = document.activeElement;
  if (S.user && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
}, 60000);
render();
</script>
</body>
</html>
